services:
  app:
    image: ${IMAGE}:${TAG}
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure
    volumes:
      - ./app:/app/app

      - .env:/app/.env
      - ${APPLICATION_FILES}:/app/files
      
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${PORT}",
        "--reload"
      ]
    ports:
      - "${PORT}:${PORT}"
  